<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 290px;
      background-color: #FEF7FF; /* M3 Light Theme Background */
      font-family: 'Roboto', 'Segoe UI', system-ui, sans-serif;
      margin: 16px;
      padding: 0;
      color: #1D1B20;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h3 {
      margin: 0;
      color: #1D1B20;
      font-size: 16px;
      font-weight: 500;
    }
    .lang-select {
      border: 1px solid #79747E;
      border-radius: 8px;
      background-color: #FEF7FF;
      color: #1D1B20;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }
    .card {
      background-color: #FFFFFF;
      border: 1px solid #CAC4D0; /* M3 Outlined Card */
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .checkbox-container {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 500;
      color: #49454F;
      cursor: pointer;
    }
    .checkbox-container input {
      margin: 0 10px 0 0;
      accent-color: #6750A4; /* M3 Primary Purple */
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .control-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: #49454F;
    }
    .control-header span {
      font-weight: 500;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mute-btn {
      background: #E8DEF8; /* M3 Light Purple Container */
      border: none;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      transition: background-color 0.2s;
    }
    .mute-btn:hover {
      background: #D0BCFF;
    }
    .mute-btn:disabled {
      background-color: rgba(29, 27, 32, 0.12);
      cursor: not-allowed;
      opacity: 0.5;
    }
    .control-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #E7E0EC;
      outline: none;
      margin: 0;
      cursor: pointer;
    }
    .control-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #6750A4; /* M3 Slider Thumb */
      cursor: pointer;
      transition: transform 0.1s;
    }
    .control-row input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    .control-row input[type="range"]:disabled {
      background: #E0E0E0;
    }
    .control-row input[type="range"]:disabled::-webkit-slider-thumb {
      background: #9E9E9E;
      cursor: not-allowed;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 40px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 100px; /* Pill Shape */
      cursor: pointer;
      transition: box-shadow 0.2s, background-color 0.2s;
      margin: 8px 0;
      font-family: inherit;
    }
    #startBtn {
      background-color: #6750A4; /* M3 Primary Accent */
      color: #FFFFFF;
    }
    #startBtn:hover {
      background-color: #533C8A;
      box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.3);
    }
    #stopBtn {
      background-color: #B3261E; /* M3 Error Red */
      color: #FFFFFF;
    }
    #stopBtn:hover {
      background-color: #8C1D18;
      box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.3);
    }
    .actions-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .actions-row .btn {
      margin: 0;
      flex: 1;
    }
    #resetBtn {
      background-color: transparent;
      border: 1px solid #79747E;
      color: #6750A4;
    }
    #resetBtn:hover {
      background-color: rgba(103, 80, 164, 0.08);
    }
    #contactBtn {
      background-color: transparent;
      border: 1px solid #79747E;
      color: #6750A4;
    }
    #contactBtn:hover {
      background-color: rgba(103, 80, 164, 0.08);
    }
    .btn:disabled {
      background-color: rgba(29, 27, 32, 0.12) !important;
      color: rgba(29, 27, 32, 0.38) !important;
      cursor: not-allowed;
      box-shadow: none !important;
      border-color: rgba(29, 27, 32, 0.12) !important;
    }
    #status {
      font-size: 12px;
      color: #49454F;
      text-align: center;
      margin-top: 12px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <h3 data-i18n="title">Simple Voice Recorder</h3>
    <select id="langSelect" class="lang-select">
      <option value="en">EN</option>
      <option value="uk">UA</option>
      <option value="ru">RU</option>
    </select>
  </div>
  
  <!-- Карточка записи вкладки -->
  <div class="card">
    <div class="control-header">
      <span data-i18n="tabVolLabel">Tab Volume (record):</span>
      <span id="tabVolumeValue">100%</span>
    </div>
    <div class="control-row">
      <button id="tabMuteBtn" class="mute-btn">🔊</button>
      <input type="range" id="tabVolume" min="0" max="200" value="100">
    </div>
  </div>

  <!-- Карточка записи микрофона -->
  <div class="card">
    <label class="checkbox-container">
      <input type="checkbox" id="micCheckbox">
      <span data-i18n="micCheckbox">Record my microphone</span>
    </label>
    <div class="control-header">
      <span data-i18n="micVolLabel">Mic Volume:</span>
      <span id="micVolumeValue">100%</span>
    </div>
    <div class="control-row">
      <button id="micMuteBtn" class="mute-btn">🔊</button>
      <input type="range" id="micVolume" min="0" max="200" value="100" disabled>
    </div>
  </div>

  <button id="startBtn" class="btn" data-i18n="startBtn">Start Recording</button>
  <button id="stopBtn" class="btn" data-i18n="stopBtn" disabled>Stop Recording</button>
  
  <div class="actions-row">
    <button id="resetBtn" class="btn" data-i18n="resetBtn">Reset Sound</button>
    <button id="contactBtn" class="btn" data-i18n="contactBtn">Contact</button>
  </div>

  <div id="status">Ready to record</div>
  <script src="popup.js"></script>
</body>
</html>
